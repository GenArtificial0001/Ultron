# SOLO DESARROLLO -- nunca se sincroniza a prod (ver sync_prod.py y
# tests/test_prod_boundary.py). Correr SIEMPRE desde backend/:
#   .venv\Scripts\python.exe -m pytest                 # suite completa
#   .venv\Scripts\python.exe -m pytest -m unit         # solo unit (rapido)
#   .venv\Scripts\python.exe -m pytest --cov           # con cobertura (.coveragerc)
#   .venv\Scripts\python.exe -m pytest --shuffle       # orden aleatorio
[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py

# --strict-*: un marcador mal escrito o una opcion invalida es un error, no un
# silencio. -ra: resumen de skipped/xfailed/failed al final.
addopts = -ra --strict-markers --strict-config

# Ningun test debe colgar la corrida (varios usan threads/asyncio). Si un test
# excede el tiempo, falla con el traceback de todos los hilos en vez de colgar.
timeout = 60
timeout_method = thread

markers =
    unit: logica pura o aislada, sin TestClient ni DB (se asigna solo).
    integration: usa TestClient/FastAPI o el DB maestro en temp (se asigna solo).
    network: permite red externa. Hoy ningun test debe usarlo -- todo es mock.
    e2e: navegador real (Playwright/Chromium) contra el backend en loopback. Lento (~3,5 min, medido): excluir con -m "not e2e".

filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
    # Deuda conocida (fuera de alcance de la suite): main.py usa
    # @app.on_event y FastAPI lo marca deprecado. Se filtra SOLO ese mensaje
    # para que cualquier otra DeprecationWarning nueva siga siendo visible.
    ignore:\s*on_event is deprecated:DeprecationWarning
